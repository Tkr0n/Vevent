name: vEventDrops
version: 1.0.0
main: com.vevent.VEventPlugin
api-version: '1.20'
authors: [TuNombre]
description: Plugin de eventos de drop generados por IA (Gemini).

commands:
  vevent:
    description: Comando principal del evento
    usage: /vevent <accept|reject|start|schedule|reload>

permissions:
  vevent.admin:
    description: Comandos administrativos de drops
    default: op
  vevent.player:
    description: Comandos de participación
    default: true