name: Build & Release Plugin

# Se ejecuta al pushear un tag v* (ej. v1.0.1):
#   git tag v1.0.1 && git push origin v1.0.1
# Compila vEventDrops con Gradle y sube el .jar al GitHub Release del tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build plugin
        run: gradle build -PpluginVersion="${GITHUB_REF_NAME#v}"

      - name: Build Fabric title mod
        working-directory: fabric-mod
        run: gradle build

      - name: Inject secrets into manifest
        if: env.TAILSCALE_AUTH_KEY != ''
        run: |
          python3 -c "
          import json, os
          with open('manifest.json', 'r') as f: data = json.load(f)
          data['tailscaleAuthKey'] = os.environ['TAILSCALE_AUTH_KEY']
          with open('manifest.json', 'w') as f: json.dump(data, f, indent=2)
          "
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Upload JAR and manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            fabric-mod/build/libs/*.jar
            manifest.json
          generate_release_notes: true
