# Simple Voice Chat — config de referencia para VerkkuCraft.
# El plugin genera este archivo solo en el primer arranque dentro de
# mc-data/plugins/voicechat/voicechat-server.properties con valores por defecto.
# Copia ESTOS valores ahí y reinicia el contenedor (docker compose restart mc).
#
# Por qué voice_host: el plugin intenta autodetectar la IP pública, pero detrás
# de Docker + Tailscale detecta la IP equivocada. Se fija a la IP Tailscale de
# la RPi para que la voz vaya por la tailnet (UDP 24454). Cloudflare Tunnel no
# transporta UDP, por eso la voz NO funciona por el hostname público.

# Puerto UDP de voz (debe coincidir con el mapeo "24454:24454/udp" del compose)
port=24454
# Dejar vacío = escuchar en todas las interfaces del contenedor
bind_address=
# IP Tailscale de la RPi (ver con `tailscale ip -4` en la RPi)
voice_host=100.118.134.127
# Distancia de voz en bloques (default 48)
voice_chat_distance=48.0
# Si se pone en true, expulsa a quien entre sin el mod de voz instalado.
# Dejar en false hasta que todos tengan el mod en el cliente.
force_voice_chat=false
