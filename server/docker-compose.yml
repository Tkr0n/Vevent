# Servidor Minecraft VerkkuCraft (Paper 1.20.4) para Raspberry Pi.
# Uso en la RPi: clonar el repo, copiar .env.example a .env y ajustar,
# luego: docker compose up -d
services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc
    restart: unless-stopped
    ports:
      - "25565:25565" # Minecraft TCP en tu RPi
      - "24454:24454/udp" # Simple Voice Chat UDP (solo funciona vía Tailscale, no por Cloudflare Tunnel)
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"          # "VANILLA" O cambia a "PAPER" si quieres un extra de rendimiento
      VERSION: "1.20.4"      # Fijado a 1.20.4 para coincidir con el plugin vEventDrops y el launcher
      MEMORY: "6G"             # Ajusta según la RAM de tu RPi (ej. 2G, 3G, 4G)
      MAX_PLAYERS: "15"
      ENABLE_AUTOPAUSE: "TRUE" # Pausa el proceso si no hay nadie conectado para no sobrecargar la RPi
      ONLINE_MODE: "FALSE"
      PLUGINS: "https://github.com/SkinsRestorer/SkinsRestorer/releases/latest/download/SkinsRestorer.jar, https://cdn.modrinth.com/data/lDAFcnRN/versions/vsRfbexG/BackpackPlus-3.2.0-all.jar, https://cdn.modrinth.com/data/9eGKb6K1/versions/62MVmInV/voicechat-bukkit-2.6.21.jar, https://cdn.modrinth.com/data/cE9CA2Px/versions/D09ywbLZ/DeathCoords.jar, https://cdn.modrinth.com/data/52W2RPUh/versions/Bc7hzkik/timber-1.8.4.jar?mr_download_reason=standalone, https://github.com/Tkr0n/Vevent/releases/download/v1.0.0/vEventDrops-1.0.0.jar, https://cdn.modrinth.com/data/vCFaodCy/versions/JpbCUK5u/GravesX-2026.4.9.1.jar?mr_download_reason=standalone, https://cdn.modrinth.com/data/eMlTUU6r/versions/kw2jPVBf/ReanimateMC-1.2.13.jar?mr_download_reason=standalone"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-saydenier}" # Se lee de server/.env (ver .env.example)
    volumes:
      - ./mc-data:/data
