# Servidor Minecraft VerkkuCraft (Fabric 1.21.1) para Raspberry Pi.
# Uso en la RPi: copiar este archivo a /mc-server/docker-compose.yaml y luego:
#   cd /mc-server && sudo docker compose down && sudo docker compose up -d
# Los mods se descargan automáticamente de Modrinth (misma lista que el launcher).
# NOTA: enhanced-ai y majruszs-progressive-difficulty NO están incluidos:
#   enhanced-ai es solo Forge/NeoForge y majruszs no tiene versión 1.21.1.
services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: mc-fabric
    restart: unless-stopped
    ports:
      - "25565:25565" # Minecraft TCP (solo vía Tailscale, no por Cloudflare Tunnel)
      - "24454:24454/udp" # Simple Voice Chat UDP (solo vía Tailscale)
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.1" # Fijado a 1.21.1 para coincidir con el launcher
      MEMORY: "8G" # Ajusta según la RAM de tu RPi
      USE_AIKAR_FLAGS: "true"
      OPS: "T3kr0n"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "saydenier"
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        ferrite-core
        krypton
        chunky
        simple-voice-chat
        luckperms
        travelersbackpack
        cardinal-components-api
        lootr
        when-dungeons-arise
        yungs-better-dungeons
        yungs-better-strongholds
        yungs-better-mineshafts
        yigd
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./data:/data

  backup:
    image: itzg/mc-backup:latest
    container_name: mc-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      RCON_HOST: mc
      RCON_PASSWORD: "saydenier"
      BACKUP_INTERVAL: "6h"
      INITIAL_DELAY: "5m"
      PRUNE_BACKUPS_DAYS: "7"
      EXCLUDES: "*.jar,cache,logs"
    volumes:
      - ./data:/data:ro # Solo lectura sobre los datos del servidor
      - ./backups:/backups # Directorio local donde se almacenarán los .tar.gz
